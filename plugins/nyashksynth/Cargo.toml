[package]
name = "nyashksynth"
description = "NyashkSynth - wavetable synthesizer"
version = "1.0.3"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "nyashksynth"
path = "src/main.rs"
required-features = ["standalone"]
