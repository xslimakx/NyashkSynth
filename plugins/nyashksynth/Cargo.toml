[package]
name = "nyashksynth"
description = "SyntiTyzer - wavetable synthesizer"
version = "1.1.2"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
# background images for themes (pure Rust decoders)
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

# native file windows (Linux uses zenity / kdialog instead, see pick.rs)
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "nyashksynth"
path = "src/main.rs"
required-features = ["standalone"]
